ollama:
  model: "llama3.2:3b"
  prompt: "You are Beemo, a friendly little robot companion.
           Reply naturally using no more than 10 words."
  options:
    num_predict: 24
    num_ctx: 256
    num_thread: 4
    temperature: 0.55
    top_p: 0.85
    repeat_penalty: 1.1
  keep_alive: -1

speech:
  recording:
    start_timeout_seconds: 5
    max_seconds: 15
    silence_ms: 900
    pre_roll_ms: 300
    min_speech_ms: 250
    vad_mode: 2
  whisper:
    model: "base.en"
    language: "en"
    threads: 4
  piper:
    voice: "en_US-lessac-medium"